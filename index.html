<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Human vs D5 Prototype v0.1</title>
<style>
:root{--bg:#f5f5f1;--ink:#171717;--muted:#6f6f69;--line:#c9c9c2;--panel:#fff;--sel:#e8e8e2;--legal:#deded7;--ball:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 2px 8px;gap:8px}.title{font-size:20px;font-weight:700}.sub{font-size:12px;color:var(--muted)}
.status{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}.status b{font-size:15px}.score{font-size:22px;font-weight:750;align-self:center;grid-row:1/3;grid-column:2}.message{font-size:13px;color:var(--muted)}
.board-wrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:9/8;width:100%;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-width:0;touch-action:manipulation}.cell:nth-child(9n+1){border-left:1px solid var(--line)}
.cell.legal::after{content:"";width:22%;aspect-ratio:1;border-radius:50%;background:var(--legal);position:absolute}.cell.selected{background:var(--sel)}
.piece{width:64%;aspect-ratio:1;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--panel);z-index:2;position:relative}.A{border-radius:50%}.B{border-radius:7px}.gk{border-width:3px}.ball{position:absolute;width:24%;aspect-ratio:1;border-radius:50%;background:var(--ball);right:-8%;bottom:-8%;border:1px solid var(--panel)}
.goalbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.goalbar button{font-size:12px;padding:8px 2px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.controls button,.goalbar button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 8px;font-weight:650;color:var(--ink)}button:disabled{opacity:.35}.danger{border-color:#999!important}
.legend{font-size:12px;color:var(--muted);margin:8px 2px 12px}.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-height:210px;overflow:auto}.log h3{font-size:14px;margin:0 0 6px}.logline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.55;border-top:1px solid #eee;padding:4px 0}.logline:first-of-type{border-top:0}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:11px;margin-left:4px}.overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;z-index:20;text-align:center;padding:24px}.overlay.show{display:flex}.overlay .box{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:360px}.overlay .big{font-size:28px;font-weight:800;margin-bottom:8px}
</style></head>
<body><div class="app">
<div class="header"><div><div class="title">Human A vs D5 B</div><div class="sub">Prototype v0.1 · Game Rules vCurrent</div></div><div class="sub">4 actions / turn</div></div>
<div class="status"><div><b id="turnText">Aのターン</b><span id="phaseBadge" class="badge">HUMAN</span></div><div id="msg" class="message">駒をタップしてください。</div><div id="score" class="score">0–0</div></div>
<div class="board-wrap"><div id="board" class="board"></div><div id="goalbar" class="goalbar"></div></div>
<div class="controls"><button id="undo">↶ Undo</button><button id="endTurn">ターン終了</button><button id="restart" class="danger">リスタート</button></div>
<div class="legend">○ A＝あなた　□ B＝D5 AI　●＝ボール　太枠＝GK　薄い点＝合法移動先。ボール保持者を選ぶとパス・ドリブル・シュート候補が出ます。</div>
<div class="log"><h3>Action log</h3><div id="logLines"></div></div>
</div>
<div id="overlay" class="overlay"><div class="box"><div id="overlayBig" class="big"></div><div id="overlayText"></div></div></div>
<script>
const ROWS=8,COLS=9,ACTIONS=4,DIR4=[[-1,0],[1,0],[0,-1],[0,1]];
const $=s=>document.querySelector(s); const cp=o=>JSON.parse(JSON.stringify(o));
function initial(score={A:0,B:0},ballTeam='A'){
 return {pieces:{A:{A1:[6,1],A2:[6,3],A3:[6,5],A4:[5,2],A5:[5,6],A6:[4,4],AG:[7,4]},B:{B1:[1,1],B2:[1,3],B3:[1,5],B4:[2,2],B5:[2,6],B6:[3,4],BG:[0,4]}},ballTeam,holder:ballTeam==='A'?'A6':'B6',score:cp(score)};
}
let state=initial(), acting='A', actionsLeft=ACTIONS, selected=null, legalTargets=[], history=[], logs=[], aiBusy=false;
let aiMem={hist:{B:[]},steer:{B:null},defHist:{B:[]}};
const other=t=>t==='A'?'B':'A'; const md=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]); const inside=p=>p[0]>=0&&p[0]<ROWS&&p[1]>=0&&p[1]<COLS;
const sign=x=>x===0?0:(x>0?1:-1); const lane=c=>c<=2?'L':(c>=6?'R':'C');
function ray(a,b){let dr=b[0]-a[0],dc=b[1]-a[1];if(dr===0&&dc!==0)return[0,sign(dc)];if(dc===0&&dr!==0)return[sign(dr),0];if(dr!==0&&Math.abs(dr)===Math.abs(dc))return[sign(dr),sign(dc)];return null}
function occ(s=state){let m={};for(let t of ['A','B'])for(let [k,p] of Object.entries(s.pieces[t]))m[p.join(',')]=[t,k];return m}
function field(t,s=state){return Object.keys(s.pieces[t]).filter(k=>!k.endsWith('G'))}
function moveLegal(s,t,k,z){return inside(z)&&!occ(s)[z.join(',')]&&md(s.pieces[t][k],z)===1}
function pathClear(s,a,b){let d=ray(a,b);if(!d)return false;let z=[...a],O=occ(s);while(true){z=[z[0]+d[0],z[1]+d[1]];if(z[0]===b[0]&&z[1]===b[1])return true;if(O[z.join(',')])return false}}
function offsideLine(s,t){let rows=field(other(t),s).map(k=>s.pieces[other(t)][k][0]).sort((a,b)=>a-b);return t==='A'?rows[1]:rows[rows.length-2]}
function isOffside(s,t,rp,bp){let L=offsideLine(s,t);return t==='A'?rp[0]<Math.min(bp[0],L):rp[0]>Math.max(bp[0],L)}
function passLegal(s,t,a,b){let src=s.pieces[t][a],dst=s.pieces[t][b],d=ray(src,dst);if(!d)return[false,'角度'];if(!pathClear(s,src,dst))return[false,'経路'];let q=occ(s)[[dst[0]-d[0],dst[1]-d[1]].join(',')];if(q&&q[0]!==t)return[false,'受け手側DF'];if(isOffside(s,t,dst,src))return[false,'オフサイド'];return[true,'OK']}
function tackleResult(s,d,k){let a=other(d),D=s.pieces[d][k],H=s.pieces[a][s.holder];if(md(D,H)!==1)return[null,'illegal'];let e=[2*H[0]-D[0],2*H[1]-D[1]],n=cp(s);if(!inside(e)){n.ballTeam=d;n.holder=k;return[n,'win_boundary']}let q=occ(s)[e.join(',')];if(!q){n.pieces[a][s.holder]=e;return[n,'push']}if(q[0]===d){n.ballTeam=d;n.holder=k;return[n,'win_opponent_block']}return[n,'friendly_block_hold']}
function shotPath(src,target){let d=ray(src,target);if(!d)return[];let z=[...src],out=[];while(z[0]!==target[0]||z[1]!==target[1]){z=[z[0]+d[0],z[1]+d[1]];out.push(z)}return out}
function shotLegal(s,t,k,target){let src=s.pieces[t][k],d=ray(src,target);if(!d)return[false,'角度'];let q=occ(s)[[src[0]+d[0],src[1]+d[1]].join(',')];if(q&&q[0]!==t&&!q[1].endsWith('G'))return[false,'DFブロック'];let gk=s.pieces[other(t)][other(t)+'G'];for(let i=0;i<shotPath(src,target).length;i++){if(md(gk,shotPath(src,target)[i])<i+1)return[false,'GK']}return[true,'OK']}
function applyAction(s,t,a){let n=cp(s),res='';if(a[0]==='move'||a[0]==='dribble')n.pieces[t][a[1]]=a[2];else if(a[0]==='pass')n.holder=a[2];else if(a[0]==='tackle'){[n,res]=tackleResult(s,t,a[1])}else if(a[0]==='shoot'){n.score[t]++;res='GOAL'}return[n,res]}
function legalActions(s,t){
 let out=[];
 if(s.ballTeam===t){
  let h=s.holder,[r,c]=s.pieces[t][h];
  for(let [dr,dc] of DIR4){let z=[r+dr,c+dc];if(moveLegal(s,t,h,z))out.push(['dribble',h,z])}
  for(let k of field(t,s))if(k!==h&&passLegal(s,t,h,k)[0])out.push(['pass',h,k]);
  for(let k of field(t,s)){
   if(k===h)continue;let [rr,cc]=s.pieces[t][k];
   for(let [dr,dc] of DIR4){let z=[rr+dr,cc+dc];if(moveLegal(s,t,k,z))out.push(['move',k,z])}
  }
  let gr=t==='A'?-1:ROWS;for(let gc=2;gc<=6;gc++)if(shotLegal(s,t,h,[gr,gc])[0])out.push(['shoot',h,[gr,gc]]);
 } else {
  let H=s.pieces[other(t)][s.holder];
  for(let k of field(t,s)){
   if(md(s.pieces[t][k],H)===1)out.push(['tackle',k]);
   let [r,c]=s.pieces[t][k];
   for(let [dr,dc] of DIR4){let z=[r+dr,c+dc];if(moveLegal(s,t,k,z))out.push(['move',k,z])}
  }
 }
 return out;
}
function progress(s,t){if(s.ballTeam!==t)return-20;let r=s.pieces[t][s.holder][0];return t==='A'?ROWS-1-r:r}
function routeProfile(s,t){let o={L:0,C:0,R:0};if(s.ballTeam!==t)return o;let br=s.pieces[t][s.holder][0];for(let k of field(t,s)){if(k===s.holder||!passLegal(s,t,s.holder,k)[0])continue;let p=s.pieces[t][k],f=t==='A'?br-p[0]:p[0]-br;if(f<0)continue;let press=field(other(t),s).filter(d=>md(p,s.pieces[other(t)][d])===1).length;o[lane(p[1])]=Math.max(o[lane(p[1])],Math.max(0,3*f+2-2*press))}return o}
function optionValue(s,t){let x=routeProfile(s,t);return Object.values(x).reduce((a,b)=>a+b,0)+3*Object.values(x).filter(v=>v>0).length}
function stateSig(s,t){return JSON.stringify([s.ballTeam,s.holder,s.pieces[t],s.pieces[other(t)]])}
function immediateRisk(s,t){if(s.ballTeam!==t)return 100;let H=s.pieces[t][s.holder],d=other(t),risk=0;for(let k of field(d,s))if(md(s.pieces[d][k],H)===1){let [,res]=tackleResult(s,d,k);risk+=res.startsWith('win')?100:(res==='push'?18:0)}return risk}
function shapeScore(s,d){let ps=field(d,s).map(k=>s.pieces[d][k]),rows=ps.map(p=>p[0]),cols=ps.map(p=>p[1]).sort((a,b)=>a-b);let gaps=0;for(let i=0;i<cols.length-1;i++)gaps+=Math.max(0,Math.abs(cols[i]-cols[i+1])-2);return-3*(Math.max(...rows)-Math.min(...rows))-2*gaps+1.5*ps.filter(p=>p[1]>=2&&p[1]<=6).length}
function coverCost(s,d){let ps=field(d,s).map(k=>s.pieces[d][k]),iso=0;for(let i=0;i<ps.length;i++){let best=99;for(let j=0;j<ps.length;j++)if(i!==j)best=Math.min(best,md(ps[i],ps[j]));if(best>3)iso++}return 10*iso}
function offballThreat(s,d){let a=other(d);if(s.ballTeam!==a)return 0;let total=0;for(let k of field(a,s)){if(k===s.holder||!passLegal(s,a,s.holder,k)[0])continue;let p=s.pieces[a][k],depth=a==='A'?ROWS-1-p[0]:p[0],nearest=Math.min(...field(d,s).map(j=>md(p,s.pieces[d][j]))),freedom=Math.max(0,nearest-1);total+=Math.pow(1+depth,1.35)*(1+.8*freedom)}return total}
function chooseTarget(s,d){let rp=routeProfile(s,other(d)),keys=['L','C','R'];return keys.reduce((best,L)=>(rp[L]-(L==='C'?0:2))<(rp[best]-(best==='C'?0:2))?L:best,'L')}
function bChooseAttack(s){let shots=legalActions(s,'B').filter(a=>a[0]==='shoot');if(shots.length)return[shots[0],'FINISH'];let bp=routeProfile(s,'B'),cand=[];for(let a of legalActions(s,'B')){if(a[0]==='shoot')continue;let [n]=applyAction(s,'B',a),ap=routeProfile(n,'B');let v=7*(progress(n,'B')-progress(s,'B'))+2*Math.max(0,Math.max(...Object.values(ap))-Math.max(...Object.values(bp)))+3*Math.max(0,Object.values(ap).filter(x=>x>0).length-Object.values(bp).filter(x=>x>0).length)+1.5*Math.max(0,optionValue(n,'B')-optionValue(s,'B'))+.8*optionValue(n,'B')+.5*progress(n,'B')-immediateRisk(n,'B');if(aiMem.hist.B.includes(stateSig(n,'B')))v-=90;cand.push([v,a])}cand.sort((x,y)=>y[0]-x[0]);aiMem.hist.B=(aiMem.hist.B.concat([stateSig(s,'B')])).slice(-12);return[cand[0][1],cand[0][1][0]==='move'?'BUILD/PROBE':'EXPLOIT']}
function bChooseDefense(s){if(!aiMem.steer.B)aiMem.steer.B=chooseTarget(s,'B');let H=s.pieces.A[s.holder],target=aiMem.steer.B,acts=legalActions(s,'B');let win=acts.some(a=>a[0]==='tackle'&&tackleResult(s,'B',a[1])[1].startsWith('win'));let intent;if(win)intent='STRIKE';else if(Math.min(...field('B',s).map(k=>md(s.pieces.B[k],H)))<=3&&optionValue(s,'A')>=8)intent='PRESS';else if(lane(H[1])===target)intent='SET';else intent='SHAPE/STEER';let cand=[];for(let a of acts){let [n,res]=applyAction(s,'B',a),v;if(res.startsWith('win'))v=10000;else{let base=shapeScore(n,'B')-coverCost(n,'B');if(intent==='PRESS'){let nearest=Math.min(...field('B',n).map(k=>md(n.pieces.B[k],n.pieces.A[n.holder])));v=base+3.5*(-6*nearest-2*optionValue(n,'A'))}else if(intent==='SET'){let adj=field('B',n).filter(k=>md(n.pieces.B[k],n.pieces.A[n.holder])===1).length;v=base+8*adj-2*progress(n,'A')}else if(intent==='STRIKE')v=base+(a[0]==='tackle'?500:0);else{let rp=routeProfile(n,'A');v=base-2*Object.entries(rp).filter(([L])=>L!==target).reduce((z,[,x])=>z+x,0)+.5*rp[target]-2*progress(n,'A')}v-=2.2*offballThreat(n,'B')}let sig=JSON.stringify(n.pieces.B);if(aiMem.defHist.B.includes(sig)&&res==='')v-=35;cand.push([v,a,res])}cand.sort((x,y)=>y[0]-x[0]);aiMem.defHist.B=(aiMem.defHist.B.concat([JSON.stringify(s.pieces.B)])).slice(-10);return[cand[0][1],'THREAT/'+intent]}
function aiMove(){return state.ballTeam==='B'?bChooseAttack(state):bChooseDefense(state)}
function pushLog(text){logs.unshift(text);renderLog()}
function actionName(a){if(a[0]==='move')return`${a[1]} 移動 → (${a[2][0]},${a[2][1]})`;if(a[0]==='dribble')return`${a[1]} ドリブル → (${a[2][0]},${a[2][1]})`;if(a[0]==='pass')return`${a[1]} → ${a[2]} パス`;if(a[0]==='tackle')return`${a[1]} タックル`;if(a[0]==='shoot')return`${a[1]} シュート (${a[2][1]})`;return a.join(' ')}
function saveUndo(){history.push({state:cp(state),actionsLeft,selected,logs:cp(logs)});if(history.length>12)history.shift()}
function humanDo(a){if(aiBusy||acting!=='A'||actionsLeft<=0)return;saveUndo();let [n,res]=applyAction(state,'A',a);state=n;actionsLeft--;selected=null;legalTargets=[];pushLog(`A ${actionName(a)}${res?' → '+res:''}`);if(res==='GOAL'){goal('A');return}render();if(actionsLeft<=0)setTimeout(startAI,250)}
function goal(team){render();let ov=$('#overlay');$('#overlayBig').textContent=`GOAL ${team}`;$('#overlayText').textContent=`Score ${state.score.A}–${state.score.B}`;ov.classList.add('show');setTimeout(()=>{ov.classList.remove('show');let score=cp(state.score);state=initial(score,other(team));acting='A';actionsLeft=ACTIONS;history=[];selected=null;aiMem={hist:{B:[]},steer:{B:null},defHist:{B:[]}};render();if(state.ballTeam==='B')pushLog('B kickoff possession. Aは守備から開始。')},900)}
async function startAI(){if(aiBusy)return;acting='B';aiBusy=true;history=[];selected=null;render();for(let i=0;i<ACTIONS;i++){await new Promise(r=>setTimeout(r,520));let [a,phase]=aiMove();let [n,res]=applyAction(state,'B',a);state=n;pushLog(`B [${phase}] ${actionName(a)}${res?' → '+res:''}`);render();if(res==='GOAL'){aiBusy=false;goal('B');return}}aiBusy=false;acting='A';actionsLeft=ACTIONS;history=[];render()}
function pieceAt(r,c){return occ(state)[[r,c].join(',')]}
function selectCell(r,c){if(aiBusy||acting!=='A')return;let q=pieceAt(r,c);if(selected){let acts=legalActions(state,'A');let targetAct=null;if(q){if(state.ballTeam==='A'&&selected===state.holder&&q[0]==='A'){targetAct=acts.find(a=>a[0]==='pass'&&a[2]===q[1])}else if(state.ballTeam==='B'&&q[0]==='B'&&q[1]===state.holder){targetAct=acts.find(a=>a[0]==='tackle'&&a[1]===selected)}}else{targetAct=acts.find(a=>(a[0]==='move'||a[0]==='dribble')&&a[1]===selected&&a[2][0]===r&&a[2][1]===c)}if(targetAct){humanDo(targetAct);return}}
 if(q&&q[0]==='A'){selected=q[1];computeTargets();render()}else{selected=null;legalTargets=[];render()}}
function computeTargets(){legalTargets=[];if(!selected)return;let acts=legalActions(state,'A');for(let a of acts){if((a[0]==='move'||a[0]==='dribble')&&a[1]===selected)legalTargets.push(a[2].join(','));if(a[0]==='pass'&&a[1]===selected)legalTargets.push('piece:'+a[2]);if(a[0]==='tackle'&&a[1]===selected)legalTargets.push('piece:'+state.holder)}}
function render(){let board=$('#board');board.innerHTML='';for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let cell=document.createElement('div');cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;if(legalTargets.includes([r,c].join(',')))cell.classList.add('legal');let q=pieceAt(r,c);if(q){let [t,k]=q,p=document.createElement('div');p.className=`piece ${t} ${k.endsWith('G')?'gk':''}`;p.textContent=k;if(selected===k)p.parentElement?.classList.add('selected');if(legalTargets.includes('piece:'+k))cell.classList.add('legal');if(state.ballTeam===t&&state.holder===k){let b=document.createElement('span');b.className='ball';p.appendChild(b)}cell.appendChild(p);if(selected===k)cell.classList.add('selected')}cell.onclick=()=>selectCell(r,c);board.appendChild(cell)}
 $('#score').textContent=`${state.score.A}–${state.score.B}`;$('#turnText').textContent=acting==='A'?`A（あなた）のターン：残り ${actionsLeft} 手`:'B（D5）のターン';$('#phaseBadge').textContent=acting==='A'?'HUMAN':'AI';$('#msg').textContent=aiBusy?'D5が考えています…':(state.ballTeam==='A'?'Aがボール保持':'Bがボール保持');$('#undo').disabled=aiBusy||acting!=='A'||history.length===0;$('#endTurn').disabled=aiBusy||acting!=='A';renderGoalbar()}
function renderGoalbar(){let g=$('#goalbar');g.innerHTML='';let acts=legalActions(state,'A').filter(a=>a[0]==='shoot'&&selected===state.holder);if(!acts.length)return;for(let a of acts){let b=document.createElement('button');b.textContent=`Shoot ${a[2][1]}`;b.onclick=()=>humanDo(a);g.appendChild(b)}}
function renderLog(){$('#logLines').innerHTML=logs.slice(0,80).map(x=>`<div class="logline">${x}</div>`).join('')}
$('#undo').onclick=()=>{if(!history.length||aiBusy)return;let h=history.pop();state=h.state;actionsLeft=h.actionsLeft;selected=h.selected;logs=h.logs;legalTargets=[];computeTargets();render();renderLog()};
$('#endTurn').onclick=()=>{if(!aiBusy&&acting==='A'){actionsLeft=0;selected=null;render();startAI()}};
$('#restart').onclick=()=>{if(aiBusy)return;state=initial();acting='A';actionsLeft=ACTIONS;selected=null;history=[];logs=[];aiMem={hist:{B:[]},steer:{B:null},defHist:{B:[]}};render();renderLog()};
render();renderLog();
</script></body></html>
